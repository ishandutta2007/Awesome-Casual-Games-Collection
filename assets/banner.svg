<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Floating Dynamic Background Elements -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="40" fill="#38bdf8">
      <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="60" fill="#c084fc">
      <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
    <rect x="900" y="50" width="50" height="50" rx="10" fill="#818cf8" transform="rotate(45 925 75)">
      <animateTransform attributeName="transform" type="rotate" values="45 925 75; 225 925 75; 45 925 75" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="100" y="200" width="40" height="40" rx="8" fill="#f43f5e" transform="rotate(15 120 220)">
      <animateTransform attributeName="transform" type="rotate" values="15 120 220; 195 120 220; 15 120 220" dur="10s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Grid lines background pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Game Controller Icon -->
    <g transform="translate(600, 65) scale(1.2)">
      <path d="M-25,-10 C-35,-10 -45,5 -40,25 C-37,35 -25,35 -18,25 L-10,12 L10,12 L18,25 C25,35 37,35 40,25 C45,5 35,-10 25,-10 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <circle cx="-18" cy="2" r="3" fill="#38bdf8"/>
      <circle cx="18" cy="-3" r="2.5" fill="#f43f5e"/>
      <circle cx="23" cy="3" r="2.5" fill="#a855f7"/>
      <circle cx="13" cy="3" r="2.5" fill="#22c55e"/>
      <circle cx="18" cy="9" r="2.5" fill="#eab308"/>
    </g>

    <!-- Title -->
    <text x="600" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="1.5" filter="url(#glow)">
      Awesome Casual Games Collection
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      🎮 The Ultimate Curated Guide to Commercial Collections &amp; Open-Source Casual Games 🧩
    </text>

    <!-- Decorative Badges in Banner -->
    <g transform="translate(600, 245)">
      <rect x="-180" y="-14" width="110" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="-125" y="2" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">PUZZLE</text>

      <rect x="-55" y="-14" width="110" height="24" rx="12" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
      <text x="0" y="2" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">CARD &amp; BOARD</text>

      <rect x="70" y="-14" width="110" height="24" rx="12" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1"/>
      <text x="125" y="2" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">ARCADE</text>
    </g>
  </g>
</svg>
